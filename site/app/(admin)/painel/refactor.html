<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="refactor.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/ae37c4f9c1.js" crossorigin="anonymous"></script>
    <title>Painel dashboard</title>
</head>

<body>
    <div class="slide">
        <main class="grid nav" id="container">
            <div class="box navbarMenu">
                <div class="header">
                    <a href="../home/index.html"><img src="../../public/institucional/logo-whiskey.svg" alt=""></a>
                </div>
                <ul class="lista-menu">
                    <li class="lista">Sensores</li>
                    <li class="lista">Financeiro</li>
                </ul>
            </div>
            <div class="box"></div>
            <div class="box kpi kpi-alerts">
                <div>
                    <h2>ALERTAS
                        ATIVOS
                    </h2>
                </div>
                <div>
                    <h2 id="div_qtdAlertasAtivos"></h2>
                </div>
                <div>
                    <p>Caso algum parâmetro esteja inadequado</p>
                </div>
            </div>
            <div class="box"></div>
            <div class="box"><h2 style="text-align: center;">Sensor 02</h2></div>
               <div class="box kpi kpi-media" >
                <div>
                    <h2>Temperatura média</h2>
                </div>
                <div class="info">
                    <div class="flex">
                        <h2 id="div_qtd_media"></h2>
                        <span class="med">ºC</span>
                    </div>
                    <div class="container">
                        <img src="../../public/icons/temp.svg" width="30" height="70" alt="">
                    </div>
                </div>
                <div>
                    <p>A temperatura adquada é entre 25º a 30º</p>
                </div>
            </div>
             <div class="box grafico-temperatura"> 
                <div class="container">
                    <h2>Temperatura por hora</h2>
                    <canvas id="myChart"></canvas>
                </div>
            </div>
            <div class="box grafico-umidade">
                <div class="container">
                    <h2>Umidade atual</h2>
                    <div class="grafico">
                        <canvas id="graficoUmidade"></canvas>
                    </div>
                    <img src="../../public/icons/umid.svg" width="60" height="60" class="img-umidade" alt="">
                    <div class="flex"><span class="text-metrica" id="div_text_metrica"></span><span>%</span></div>
                </div>
            </div>
            <div class="box grafico-temperatura"> 
                <div class="container">
                    <h2>Umidade por hora</h2>
                    <canvas id="chartUmidade"></canvas>
                </div>
            </div>
            <div class="box logs" id="log">
                <h2>Histórico</h2>
                <span>Os logs dos ultimos 10 dados</span>
                <h3>Sensores: <span>3</span></h3>
                <ul id="div_registros">
                </ul>
            </div>
        </main>
    </div>
</body>

</html>
<script>
    function apaga() {
        box1.style.display = 'none'
        container.classList.remove('nav')
    }
    var registros = [[28, 80, 343], [13, 82, 344], [28, 83, 345], [23, 76, 346], [31, 87, 347], [43, 80, 348], [28, 82, 349], [28, 82, 349], [28, 82, 349], [28, 82, 349], [28, 82, 349], [28, 82, 349], [28, 82, 349]]

    var navBarOpen = true
    function handleNavbar() {
        if (navBarOpen) {
            navbar.style.width = `0px`;
            navBarOpen = false;
        } else {
            navbar.style.width = `15%`
            navBarOpen = true;
        }
    }

    function init() {
        animacao.innerHTML = `
      <img src="./animacao.svg" width="845" height="606" alt="" srcset="">
      `
    }
    function render() {
        var contadorRegistros = 0
        var qtdRegistro = 10
        var qtdAlertasAtivos = 0
        var div_registrosHTML = ''
        while (contadorRegistros < qtdRegistro) {
            var color = 'green'
            var delay = contadorRegistros * 200
            if ((registros[contadorRegistros][0] > 35 && registros[contadorRegistros][0] < 40) || (registros[contadorRegistros][0] < 28 && registros[contadorRegistros][0] > 20)) {
                color = 'yellow'
                qtdAlertasAtivos++
            } else if (registros[contadorRegistros][0] >= 40 || registros[contadorRegistros][0] <= 20) {
                color = 'red'
                qtdAlertasAtivos++
            }
            var contadorAlerta = 0
            div_registrosHTML += ` 
         <li class="card-historico ${color}"  style="animation-delay: ${delay}ms">
                        <div class="flex" style="gap:12px;">
                            <div class="flex">
                                <p id="met">
                                    ${registros[contadorRegistros][0]}
                                </p>
                                <p id="med">ºC</p>
                            </div>
                            <div class="flex"  id="met">-</div>
                            <div class="flex">
                                <p id="met">${registros[contadorRegistros][1]}</p>
                                <p id="med">%</p>
                            </div>
                        </div>
                        <div>
                            <div class="flex" style="gap:12px;">
                            <div class="flex">
                                <p id="met-menos">
                                    #0${registros[contadorRegistros][2]}
                                </p>
                            </div>
                            <div class="flex"  id="met-menos">•</div>
                            <div class="flex">
                                <p id="met-menos">
                                    Sensor
                                </p>
                            </div>
                        </div>
                        </div>
                </li>
                `
            contadorRegistros++
        }
        div_registros.innerHTML = div_registrosHTML
        var intervaloAlerta = setInterval(() => {
            if (contadorAlerta < qtdAlertasAtivos) {
                contadorAlerta++
                div_qtdAlertasAtivos.innerHTML = contadorAlerta
            } else (
                clearInterval(intervaloAlerta)
            )
        }, 250)
        var contadorTemp = 0
        var intervaloTemperatura = setInterval(() => {
            if (contadorTemp < 26) {
                contadorTemp++
                div_qtd_media.innerHTML = contadorTemp
            } else (
                clearInterval(intervaloTemperatura)
            )
        }, 100)
    }
    render()
    const ctx = document.getElementById('myChart');
    const ctxUmidade = document.getElementById('chartUmidade');

    var graficoLinha = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['5h', '10h', '15h', '20h', '22h', '3h'],
            datasets: [{
                label: 'Temperatura por hora',
                tension: 0.4,
                fill: true,
                borderColor: '#50C156',
                backgroundColor: 'rgba(80, 193, 86,0.5)',
                data: [27.5, 26.8, 27.9, 28.2, 27.1, 27.6, 40],
                borderWidth: 2,
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: { enabled: true }
            }
        }
    });
    var graficoLinha = new Chart(ctxUmidade, {
        type: 'line',
        data: {
            labels: ['5h', '10h', '15h', '20h', '22h', '3h'],
            datasets: [{
                label: 'Umidade por hora',
                tension: 0.4,
                fill: true,
                borderColor: '#50C156',
                backgroundColor: 'rgba(80, 193, 86,0.5)',
                data: [27.5, 26.8, 27.9, 28.2, 27.1, 27.6, 40],
                borderWidth: 2,
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: { enabled: true }
            }
        }
    });
    var porcentagem = 70
    const graficoCtx = document.getElementById('graficoUmidade');
    var graficoPizza = new Chart(graficoCtx, {
        type: 'doughnut',
        data: {
            datasets: [{
                label: 'Umidade',
                data: [porcentagem, 30],
                backgroundColor: ['#5cca07bd', '#eee'],
                borderWidth: 0,
                borderRadius: [10, 0]
            }]
        },
        options: {
            cutout: '75%',
            rotation: -90,
            circumference: 180,
            plugins: {
                legend: { display: true },
                tooltip: { enabled: true }
            }
        }
    });
    function diminuirPorcentage() {
        var corPorcentagem = 'black'
        var contadorLinha = 0
        const intervaloMenos = setInterval(() => {
            while (contadorLinha < dadosLinha.length) {
                if (contadorLinha == 2) {
                    if (dadosLinha[contadorLinha] < 40) {
                        dadosLinha[contadorLinha] += 5
                    } else {
                        dadosLinha[contadorLinha] -= 5
                    }
                } else if (contadorLinha == 5) {
                    if (dadosLinha[contadorLinha] < 40) {
                        dadosLinha[contadorLinha] += 7
                    } else {
                        dadosLinha[contadorLinha] -= 7
                    }
                } else if (contadorLinha == 7) {
                    if (dadosLinha[contadorLinha] < 40) {
                        dadosLinha[contadorLinha] += 1.8
                    } else {
                        dadosLinha[contadorLinha] -= 1.8
                    }
                }

                contadorLinha++
            }
            if (porcentagem <= 50) {
                clearInterval(intervaloMenos);
                aumentarPorcentagem()
            } else {
                if (porcentagem <= 70) {
                    corPorcentagem = 'red'
                }
                else if (porcentagem < 80 && porcentagem > 70) {
                    corPorcentagem = 'yellow'
                }
                div_text_metrica.innerHTML = `<span  class="${corPorcentagem}">${porcentagem}</span>`
                porcentagem -= 1;
                graficoPizza.data.datasets[0].data = [porcentagem, 100 - porcentagem];
                graficoLinha.data.datasets[0].data = [dadosLinha[0], dadosLinha[1], dadosLinha[2], dadosLinha[3], dadosLinha[4], dadosLinha[5], dadosLinha[6]];
                graficoPizza.update({
                    duration: 100,
                    easing: 'easeInOutQuad'
                });
                graficoLinha.update({
                    duration: 100,
                    easing: 'easeInOutQuad'
                });
            }
        }, 100);
    }
    var dadosLinha = graficoLinha.data.datasets[0].data
    function aumentarPorcentagem() {
        var corPorcentagem = 'black'
        var contadorLinha = 0
        const intervaloMais = setInterval(() => {
            while (contadorLinha < dadosLinha.length) {
                if (contadorLinha == 3) {
                    if (dadosLinha[contadorLinha] > 20) {
                        dadosLinha[contadorLinha] -= 4
                    } else {
                        dadosLinha[contadorLinha] += 4
                    }
                } else if (contadorLinha == 1) {
                    if (dadosLinha[contadorLinha] > 20) {
                        dadosLinha[contadorLinha] -= 6
                    } else {
                        dadosLinha[contadorLinha] += 6
                    }
                } else if (contadorLinha == 6) {
                    if (dadosLinha[contadorLinha] > 20) {
                        dadosLinha[contadorLinha] -= 3
                    } else {
                        dadosLinha[contadorLinha] += 3

                    }
                }

                contadorLinha++
            }
            if (porcentagem >= 90) {
                clearInterval(intervaloMais);
                diminuirPorcentage()
            } else {
                if (porcentagem <= 70) {
                    corPorcentagem = 'red'
                }
                else if (porcentagem < 80 && porcentagem > 70) {
                    corPorcentagem = 'yellow'
                }
                div_text_metrica.innerHTML = `<span  class="${corPorcentagem}">${porcentagem}</span>`
                porcentagem += 1;
                graficoPizza.data.datasets[0].data = [porcentagem, 100 - porcentagem];
                graficoLinha.data.datasets[0].data = [dadosLinha[0], dadosLinha[1], dadosLinha[2], dadosLinha[3], dadosLinha[4], dadosLinha[5], dadosLinha[6]];
                graficoPizza.update({
                    duration: 100,
                    easing: 'easeInOutQuad'
                });
                graficoLinha.update({
                    duration: 100,
                    easing: 'easeInOutQuad'
                });
            }
        }, 100);
    }
    diminuirPorcentage()
</script>
