<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../utils/index.css">
    <link rel="shortcut icon" href="../../public/institucional/favicon.png" type="image/x-icon">

    <title>Gestão de Usuários</title>
</head>

<body>
    <header id="header">
        <nav>
            <a href="../painel/index.html"><img src="../../public/institucional/logo-whiskey.svg" alt=""></a>
        </nav>
        <div class="navbar">
        </div>
    </header>
    <main>
        <div class="box_left">
            <span class="title">PERFIL ATUAL</span>

            <div class="container">
                <img src="../../public/painel/Test Account.svg" alt="" class="user"
                    style="background-color: #1C311E; border-radius: 50%; width: 70px; height: 70px; object-fit: cover;">
                <span class="username">Júlia Araripe</span>
                <span class="useremail">julia.araripe@whiskey.com</span>
                <span class="userinfo">00.000.000/0001-00</span>
                <span class="typeOfWhisky">Tipo Whisky</span>
            </div>
        </div>
        <div class="box_right">
            <div class="container">
                <div class="btn_register">
                    <button onclick="window.location.href='../../cadastro/index.html'">
                        <img src="icons/user_icon.png" alt="Ícone de usuário">
                        CADASTRAR
                    </button>
                </div>
                <span class="title">Gestão de Usuários</span>
                <div class="table_users_div">
                    <table class="table_users">
                        <thead>
                            <tr class="table_head">
                                <th><input type="checkbox" name="" class='checkbox' id="checkbox" onclick="selectAll()">
                                </th>
                                <th>Nome</th>
                                <th>E-mail</th>
                            </tr>
                        </thead>
                        <tbody id="tabela">
                        </tbody>
                    </table>
                </div>

                <div class="nav">
                    <button onclick="deletar()">
                        <img src="icons/icon_trash.png" alt="">
                        DELETAR</button>

                    <nav class="pagination">
                        <ul>
                            <li>1</li>
                            <li>2</li>
                            <li>3</li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </main>
</body>
<script>
    var listaUsuarios = [
        [1, 'Vitória Ferreira', 'vitoria@whiskey.tech'],
        [2, 'André Santos', 'andre@whiskey.tech'],
        [3, 'Giovanni Angel', 'giovanni@whiskey.tech']
    ]
    var listaSelect = []

    function render() {
        var tabelaHtml = ''
        var cont = 0
        for (var cont = 0; cont < listaUsuarios.length; cont++) {
            var pessoa = listaUsuarios[cont]
            tabelaHtml += ` <tr>
                                <td><input type="checkbox" oninput="selecionar(${pessoa[0]})" value=${pessoa[0]} name="" class='checkbox'
                                        id="checkbox${pessoa[0]}"></td>
                                <td>${pessoa[1]}</td>
                                <td>${pessoa[2]}</td>
                            </tr> `
        }
        tabela.innerHTML = tabelaHtml
    }
    render()
    function selecionar(id) {
        listaSelect.push(id)
    }
    function deletar() {
        console.log('lista select: ' + listaSelect)
        var novaLista = []
        for (var i = 0; i < listaUsuarios.length; i++) {
            var usuarioAtual = listaUsuarios[i]
            for (var iS = 0; iS < listaSelect.length; iS++) {
                if (usuarioAtual[0] != listaSelect[iS]) {
                        novaLista.push(usuarioAtual);
                }
            }
        }
        listaSelect = []
        listaUsuarios = novaLista
        render()
        console.log('nova lista: ' + novaLista)
    }

    function selectAll() {
        for (var i = 0; i < listaUsuarios; i++) {
            listaSelect.push(listaUsuarios[i][0])
        }
    }
</script>

</html>
