<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Específica</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="header">
    </div>
    <main class="conteudo-principal">

        <section class="resumo">
            <div class="cartao-resumo tipos-situacao">
                <div class="tooltip-container">
                    <div class="tooltip-icon">?</div>
                    <div class="tooltip-msg">
                        <p><span class="estavel" style="color: #50C156; ">ESTÁVEL:</span> 0 alertas ativos</p>
                        <p><span class="atençao" style="color: #FFA500;">ATENÇÃO:</span> >= 1 alertas em atenção</p>
                        <p><span class="grave" style="color: #CF1619">GRAVE:</span> >= 1 alertas grave</p>
                    </div>
                </div>
                <h3>TIPOS DE SITUAÇÃO</h3>
                <div class="lista-situacao">
                    <div class="item-situacao">
                        <span class="label">Grave:</span>
                        <div class="flex">
                            <span class="dot grave"></span>
                            <span class="valor" id="kpi_grave">1</span>
                        </div>
                    </div>

                    <div class="item-situacao">
                        <span class="label">Atenção:</span>
                        <div class="flex">
                            <span class="dot atencao"></span>
                            <span class="valor" id="kpi_atencao">1</span>
                        </div>
                    </div>
                    <div class="item-situacao">
                        <span class="label">Estável:</span>
                        <div class="flex">
                            <span class="dot estavel"></span>
                            <span class="valor" id="kpi_estavel">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="monitoramento-cockpit">

            <div class="painel-linha">
                <div class="kpi-lateral kpi-temp">
                    <div class="kpi-header-lat">
                        <img src="icons/tempIcon.png" width="24">
                        <span>TEMPERATURA</span>
                    </div>
                    <div class="kpi-valor-lat">
                        <div id="temperaturaAtual"></div>
                    </div>
                    <div class="kpi-status-lat status-atencao">
                    </div>
                    <div class="kpi-meta">Ideal: 20° - 25°</div>
                </div>

                <div class="grafico-lateral">
                    <div class="grafico-header">
                        <h3>Histórico (12h)</h3>
                        <div class="data-horario">
                            <label for="periodo">Período:</label>
                            <input type="date" id="data_dashboard" onchange="atualizarGrafico(this.value)">

                            <div class="period-selector">
                                <select name="periodo" id="periodo" onchange="filtrarHora(this.value)">
                                    <option value="12">Últimas 12hs</option>
                                    <option value="24">Últimas 24hs</option>
                                    <option value="168">Última Semana</option>
                                    <option value="720">Último Mês</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="canvas-wrapper">
                        <canvas id="myChart_Temperature"></canvas>
                    </div>
                </div>
            </div>

            <div class="painel-linha">
                <div class="kpi-lateral kpi-umid">
                    <div class="kpi-header-lat">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
                        </svg>
                        <span>UMIDADE</span>
                    </div>
                    <div class="kpi-valor-lat">
                        <div id="umidadeAtual"></div>
                    </div>
                    <div class="kpi-status-lat status-estavel">
                        <span class="dot"></span> ESTÁVEL
                    </div>
                    <div class="kpi-meta">Ideal: 50% - 80%</div>
                </div>

                <div class="grafico-lateral">
                    <div class="grafico-header">
                        <h3>Histórico (12h)</h3>
                        <div class="data-horario">
                            <label for="periodo">Período:</label>
                            <input type="date" id="data_dashboard" onchange="atualizarGrafico(this.value)">

                            <div class="period-selector">
                                <select name="periodo" id="periodo" onchange="filtrarHora(this.value)">
                                    <option value="12">Últimas 12hs</option>
                                    <option value="24">Últimas 24hs</option>
                                    <option value="168">Última Semana</option>
                                    <option value="720">Último Mês</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="canvas-wrapper">
                        <canvas id="myChart_Umidade"></canvas>
                    </div>
                </div>
            </div>
        </section>
        </div>
        <div class="bob"><img src="">
        </div>
    </main>
</body>

</html>
<script>
    var idSensor = 1;
    carregarKPIStatus(idSensor);


    const chartTemperatura = new Chart(document.getElementById('myChart_Temperature'), {
        type: 'line',
        data: {
            labels: ['10min', '20min', '30min', '40min', '50min', '60min'],

            datasets: [
                {
                    label: 'Temperatura',
                    fill: true,
                    tension: 0.1,
                    borderColor: '#2D5031',
                    backgroundColor: 'rgba(80, 193, 86,0.5)',
                    borderWidth: 2,
                }, {
                    label: 'Máximo',
                    fill: true,
                    tension: 0.1,
                    borderColor: '#7d080a80',
                    backgroundColor: '#7d080a80',
                    data: [],
                    borderWidth: 2,
                },
                {
                    label: 'Mínimo',
                    fill: true,
                    tension: 0.1,
                    borderColor: '#0f6f9f80',
                    backgroundColor: '#0f6f9f80',
                    data: [],
                    borderWidth: 2,
                }
            ]
        },
        options: {
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            plugins: {
                legend: {
                    position: 'top'
                },
                tooltip: { enabled: true },
                annotation: {
                    annotations: {
                        limiteMaximo: {
                            type: 'line',
                            yMin: 30,
                            yMax: 30,
                            borderColor: '#7d080a80',
                            borderWidth: 3,
                        },
                        limiteMinimo: {
                            type: 'line',
                            yMin: 20,
                            yMax: 20,
                            borderColor: '#0f6f9f80',
                            borderWidth: 3,
                            label: {
                                content: 'Limite Minimo (20 °C)',
                                enabled: true,
                                position: 'end',
                                backgroundColor: 'rgba(255,0,0,0.7)',
                                color: '#fff'
                            }
                        }
                    }
                }
            }
        }
    });

    const chartUmidade = new Chart(document.getElementById('myChart_Umidade'), {
        type: 'line',
        data: {
            labels: ['10min', '20min', '30min', '40min', '50min', '60min'],
            datasets: [
                {
                    label: 'Umidade',
                    tension: 0,
                    fill: true,
                    borderColor: '#2D5031',
                    backgroundColor: 'rgba(80, 193, 86,0.5)',
                    borderWidth: 2,
                    spanGaps: true,
                },
                {
                    label: 'Máximo',
                    fill: true,
                    tension: 0.1,
                    borderColor: '#7d080a80',
                    backgroundColor: '#7d080a80',
                    data: [],
                    borderWidth: 2,
                },
                {
                    label: 'Mínimo',
                    fill: true,
                    tension: 0.1,
                    borderColor: '#0f6f9f80',
                    backgroundColor: '#0f6f9f80',
                    data: [],
                    borderWidth: 2,
                }
            ]
        },
        options: {
            maintainAspectRatio: false,
            scales: {
                y: {
                    min: 50,
                    max: 90,
                },
            },
            plugins: {
                legend: {
                    position: 'top'
                },
                tooltip: { enabled: true },
                annotation: {
                    annotations: {
                        limiteMaximo: {
                            type: 'line',
                            yMin: 80,
                            yMax: 80,
                            borderColor: '#7d080a80',
                            borderWidth: 3,
                        },
                        limiteMinimo: {
                            type: 'line',
                            yMin: 60,
                            yMax: 60,
                            borderColor: '#0f6f9f80',
                            borderWidth: 3,
                            label: {
                                content: 'Limite Minimo (20 °C)',
                                enabled: true,
                                position: 'end',
                                backgroundColor: 'rgba(255,0,0,0.7)',
                                color: '#fff'
                            }
                        }
                    }
                }
            }
        }
    });

    var paginacao = {};
    var tempo = {};

    function obterDados(grafico, endpoint) {
        fetch('http://localhost:3333/sensor/' + endpoint)
            .then(response => response.json())
            .then(dado => {

                var numero = dado.temperatura || dado.umidade || dado.valor;
                console.log(dado)

                numero = parseFloat(numero);
                if (isNaN(numero)) return;

                    if(dado.temperatura){
                    document.getElementById("temperaturaAtual").innerText = dado.temperatura;
                    }else{
                         document.getElementById("temperaturaAtual").innerText =  26.20;
                    }   
                

                    if(dado.umidade){
                    document.getElementById("umidadeAtual").innerText = dado.umidade;
                    }else{
                        document.getElementById("umidadeAtual").innerText = 48
                    }
                

                if (grafico.data.labels.length >= 10) {
                    grafico.data.labels.shift();
                    grafico.data.datasets[0].data.shift();
                }

                grafico.data.labels.push(dado.hr_coleta || new Date().toLocaleTimeString());
                grafico.data.datasets[0].data.push(numero);

                grafico.update();
            })
            .catch(error => console.error('Erro ao obter dados:', error));
    }



    setInterval(() => {
        obterDados(chartTemperatura, `tempAtual/${idSensor}`);
        obterDados(chartUmidade, `umidAtual/${idSensor}`);
    }, 1000);



    // TEMPERATURA

    fetch(`/especifica/tempAtual/${idSensor}`)
        .then(res => res.json())
        .then(dados => {
            const div = document.getElementById("temperaturaAtual");
            if (dados && dados.temperatura != undefined) {
                const temp = dados.temperatura;
                div.innerHTML = `${temp}°C`;
                atualizarEstadoTemp(temp);
            } else {
                div.innerHTML = 0;
            }
        })
        .catch(err => {
            console.error("Erro ao exibir a temperatura", err);
        });

    function atualizarEstadoTemp(temp) {
        const bloco = document.querySelector(".kpi-temp .kpi-status-lat");

        if (temp <= 10 || temp >= 30) {
            bloco.classList.remove("status-estavel", "status-atencao");
            bloco.classList.add("status-grave");
            bloco.innerHTML = `<span class="dot"></span> GRAVE`;
        }
        else if (temp <= 20 || temp >= 25) {
            bloco.classList.remove("status-estavel", "status-grave");
            bloco.classList.add("status-atencao");
            bloco.innerHTML = `<span class="dot"></span> ATENÇÃO`;
        }
        else {
            bloco.classList.remove("status-grave", "status-atencao");
            bloco.classList.add("status-estavel");
            bloco.innerHTML = `<span class="dot"></span> ESTÁVEL`;
        }
    }



    // UMIDADE

    fetch(`/especifica/umidAtual/${idSensor}`)
        .then(res => res.json())
        .then(dados => {
            const div = document.getElementById("umidadeAtual");
            if (dados && dados.umidade != undefined) {
                const umid = dados.umidade;
                div.innerHTML = `${umid}%`;
                atualizarEstadoUmid(umid);
            } else {
                div.innerHTML = 404;
            }
        })
        .catch(err => {
            console.error("Erro ao exibir a umidade", err);
        });

    function atualizarEstadoUmid(umid) {
        const bloco = document.querySelector(".kpi-umid .kpi-status-lat");

        if (umid <= 30 || umid >= 90) {
            bloco.classList.remove("status-estavel", "status-atencao");
            bloco.classList.add("status-grave");
            bloco.innerHTML = `<span class="dot"></span> GRAVE`;
        }
        else if (umid <= 50 || umid >= 80) {
            bloco.classList.remove("status-estavel", "status-grave");
            bloco.classList.add("status-atencao");
            bloco.innerHTML = `<span class="dot"></span> ATENÇÃO`;
        }
        else {
            bloco.classList.remove("status-grave", "status-atencao");
            bloco.classList.add("status-estavel");
            bloco.innerHTML = `<span class="dot"></span> ESTÁVEL`;
        }
    }



    // KPI TIPOS DE SITUAÇÕES

    function carregarKPIStatus(idSensor) {
        fetch(`/especifica/contagemStatus/${idSensor}`)
            .then(res => res.json())
            .then(dados => {
                let grave = dados.grave;
                let atencao = dados.atencao;
                let estavel = dados.estavel;

                document.getElementById("kpi_grave").innerText = grave;
                document.getElementById("kpi_atencao").innerText = atencao;
                document.getElementById("kpi_estavel").innerText = estavel;
            })
            .catch(err => console.error("Erro:", err));
    }


</script>
