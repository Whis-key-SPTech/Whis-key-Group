<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Específica</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="header">
        <a><img src="../../public/institucional/logo-whiskey.svg" alt=""></a>
    </div>
    <main class="conteudo-principal">
        <section class="info-kpis">
            <div class="infoSensor">
                <h3>Sensor 6</h3>
                <div id="corSituacaoBarril">
                    <img src="icons/barril.svg">
                </div>
                <div class="infoLocalidade">Local: <span>Armazém 5 | Setor 2 - Cima</span></div>
            </div>

            <div class="kpis">
                <div class="alerta-atencao">
                    <span id="qtdAtencao">3</span>
                    <span>ALERTAS ATENÇÃO</span>
                </div>
                <div class="alerta-grave">
                    <span id="qtdGrave">5</span>
                    <span>ALERTAS GRAVE</span>
                </div>
            </div>
        </section>

        <section class="info-temperatura">
            <div class="resumo-temperatura">
                <div class="titulo">
                    <h3>Temperatura<br>Atual
                    </h3>
                    <div class="fundoIcon">
                        <img src="icons/tempIcon.png" height="25px">
                    </div>
                </div>
                <div id="temperatura-atual">
                    28ºC
                </div>
                <div class="legenda">
                    <div class="box-legenda">
                        <div class="regular"></div>
                        <span class="parametro-regular"></span>
                    </div>
                    <div class="box-legenda">
                        <div class="atencao"></div>
                        <span class="parametro-atencao"></span>
                    </div>
                    <div class="box-legenda">
                        <div class="grave"></div>
                        <span class="parametro-grave"></span>
                    </div>
                </div>
            </div>

            <div class="graficos">
                <div class="container-temperatura">
                    <nav class="abas-navegacao">
                        <h2>Temperatura</h2>
                        <div class="data-horario">
                            <span id="dataAtual">
                                14/10
                            </span>
                            <img src="icons/calendarIcon.png" height="20px">
                            <select id="select_horario">
                                <option value="am">AM</option>
                                <option value="pm">PM</option>
                            </select>
                        </div>
                    </nav>
                    <canvas id="myChart_Temperature"></canvas>
                </div>
            </div>
        </section>

        <section class="info-umidade">
            <div class="resumo-umidade">
                <div class="titulo">
                    <h3>Umidade<br>Atual
                    </h3>
                    <div class="fundoIcon">
                        <img src="icons/tempIcon.png" height="25px">
                    </div>
                </div>
                <div id="umidade-atual">
                    60%
                </div>
                <div class="legenda">
                    <div class="box-legenda">
                        <div class="regular"></div>
                        <span class="parametro-regular"></span>
                    </div>
                    <div class="box-legenda">
                        <div class="atencao"></div>
                        <span class="parametro-atencao"></span>
                    </div>
                    <div class="box-legenda">
                        <div class="grave"></div>
                        <span class="parametro-grave"></span>
                    </div>
                </div>
            </div>

            <div class="graficos">
                <div class="container-temperatura">
                    <nav class="abas-navegacao">
                        <h2>Umidade</h2>
                        <div class="data-horario">
                            <span id="dataAtual">
                                14/10
                            </span>
                            <img src="icons/calendarIcon.png" height="20px">
                            <select id="select_horario">
                                <option value="am">AM</option>
                                <option value="pm">PM</option>
                            </select>
                        </div>
                    </nav>
                    <canvas id="myChart_Umidade"></canvas>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
<script>
    const ctx = document.getElementById('myChart_Temperature');

    var graficoLinha = new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['10min', '20min', '30min', '40min', '50min', '60min'],
            datasets: [
                {
                    label: 'Temperatura',
                    fill: true,
                    tension: 0.1,
                    borderColor: '#2D5031',
                    backgroundColor: 'rgba(80, 193, 86,0.5)',
                    data: [25, 31, 32, 37, 31, 29, 28],
                    borderWidth: 2,
                }, {
                    label: 'Máximo',
                    fill: true,
                    tension: 0.1,
                    borderColor: '#7d080a80',
                    backgroundColor: '#7d080a80',
                    data: [],
                    borderWidth: 2,
                },
                {
                    label: 'Mínimo',
                    fill: true,
                    tension: 0.1,
                    borderColor: '#0f6f9f80',
                    backgroundColor: '#0f6f9f80',
                    data: [],
                    borderWidth: 2,
                }
            ]
        },
        options: {
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true
                }
            },
            plugins: {
                legend: {
                    position: 'top'
                },
                tooltip: { enabled: true },
                annotation: {
                    annotations: {
                        limiteMaximo: {
                            type: 'line',
                            yMin: 30,
                            yMax: 30,
                            borderColor: '#7d080a80',
                            borderWidth: 3,
                        },
                        limiteMinimo: {
                            type: 'line',
                            yMin: 20,
                            yMax: 20,
                            borderColor: '#0f6f9f80',
                            borderWidth: 3,
                            label: {
                                content: 'Limite Minimo (20 °C)',
                                enabled: true,
                                position: 'end',
                                backgroundColor: 'rgba(255,0,0,0.7)',
                                color: '#fff'
                            }
                        }
                    }
                }
            }
        }
    });

    const ctxUmidade = document.getElementById('myChart_Umidade');
    
            var graficoLinha = new Chart(ctxUmidade, {
                type: 'line',
                data: {
                    labels: ['10min', '20min', '30min', '40min', '50min', '60min'],
                    datasets: [
                        {
                            label: 'Umidade',
                            tension: 0,
                            fill: true,
                            borderColor: '#2D5031',
                            backgroundColor: 'rgba(80, 193, 86,0.5)',
                            data: [72, 65, 60, 58, 59, 60, 61],
                            borderWidth: 2,
                            spanGaps: true,
                        },
                        {
                            label: 'Máximo',
                            fill: true,
                            tension: 0.1,
                            borderColor: '#7d080a80',
                            backgroundColor: '#7d080a80',
                            data: [],
                            borderWidth: 2,
                        },
                        {
                            label: 'Mínimo',
                            fill: true,
                            tension: 0.1,
                            borderColor: '#0f6f9f80',
                            backgroundColor: '#0f6f9f80',
                            data: [],
                            borderWidth: 2,
                        }
                    ]
                },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 50,
                            max: 90,
                        },
                    },
                    plugins: {
                        legend: {
                            position: 'top'
                        },
                        tooltip: { enabled: true },
                        annotation: {
                            annotations: {
                                limiteMaximo: {
                                    type: 'line',
                                    yMin: 80,
                                    yMax: 80,
                                    borderColor: '#7d080a80',
                                    borderWidth: 3,
                                },
                                limiteMinimo: {
                                    type: 'line',
                                    yMin: 60,
                                    yMax: 60,
                                    borderColor: '#0f6f9f80',
                                    borderWidth: 3,
                                    label: {
                                        content: 'Limite Minimo (20 °C)',
                                        enabled: true,
                                        position: 'end',
                                        backgroundColor: 'rgba(255,0,0,0.7)',
                                        color: '#fff'
                                    }
                                }
                            }
                        }
                    }
                }
            });
</script>
