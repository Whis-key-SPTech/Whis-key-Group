<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHISKEY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="header">
        <a><img src="../../public/institucional/logo-whiskey.svg" alt=""></a>
    </div>
    <main class="conteudo-principal">
        <section class="resumo">
            <div class="cartao-resumo ultimas-horas">
                <h3>Maior intervalo em alerta <span class="grave">GRAVE</span></h3>
                <p>Rua Miguel - 4 horas</p>
            </div>
            <div class="cartao-resumo sensores">
                <h3>Sensores</h3>
                <p>30</p>
            </div>
            <div class="cartao-resumo tipos-situacao">
                <h3>TIPOS DE SITUAÇÃO</h3>
                <p><span class="estavel">ESTÁVEL:</span> 0 alertas ativos</p>
                <p><span class="atençao" style="color: #FFA500;">ATENÇÃO:</span> >= 1 alertas em atenção</p>
                <p><span class="grave">GRAVE:</span> >= 1 alertas grave</p>
            </div>
        </section>

        <div class="container">
            <nav class="abas-navegacao">
                <h2>Destilarias</h2>
                <div class="filter">
                    <h4>Filtros:</h4>
                    <ul>
                        <li class="filter-active" onclick="filtrar(0)" data-filter="todas">Todas</li>
                        <li class="filter" data-filter="grave" onclick="filtrar(3)">Grave</li>
                        <li class="filter" data-filter="atencao" onclick="filtrar(2)">Atenção</li>
                        <li class="filter" data-filter="estavel" onclick="filtrar(1)">Estável</li>
                    </ul>
                </div>
                <h3>Período: Últimas 10hs</h3>
            </nav>

            <section class="lista-destilarias" id="lista_destilaria">
            </section>
            <div class="bob"><img src="">
            </div>
    </main>
    <script>
        var listaDestilas = []
        function filtrar(opcao) {
            var filtro = opcao
            listar(filtro)
        }

        function listar(peso) {
            var listaMensagem = ''
            fetch("/destilaria/all", {
                method: "GET",
            })
                .then(function (resposta) {
                    resposta.json().then((destilarias) => {
                        console.log(destilarias)
                        destilarias.forEach((destilaria) => {
                            var color = ''
                            if (destilaria.situacao == 'GRAVE') {
                                color = 'grave'
                            }
                            if (destilaria.situacao == 'ATENCAO') {
                                color = 'atencao'
                            }
                            if (destilaria.situacao == 'ESTAVEL') {
                                color = 'estavel'
                            }

                            if (destilaria.peso != peso && peso != 0 ) {
                                listaMensagem += null
                            }
                            else {
                                listaMensagem += `
                        <a href="../sensores/index.html">
                        <div class="cartao-destilaria ${color}">
                                <h3>${destilaria.rua}</h3>
                                <br>
                                <div class="sensores-situacao">
                                    <span>SENSORES<br><span class="sensores">${destilaria.qtdSensor}</span></span>
                                    <span>SITUAÇÃO ATUAL<br><span class="situacao">${destilaria.situacao}</span></span>
                                </div>
                            </div>
                        </a>
                    `;
                            }

                        });
                        console.log('entrou')
                        lista_destilaria.innerHTML = listaMensagem
                    });
                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                });
        }
        listar(0)
    </script>
</body>

</html>
