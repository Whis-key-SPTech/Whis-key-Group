<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./index.css">
  <title>Tela de Login</title>
</head>
<body>
  <header class="header">
    <div class="logo">
     <img src="../public/Whiskey.logo 1.svg" width="258.64" height="145.49">
    </div>
  </header>
  <main class="main">
    <img src="../public/S{KEY}.svg" width="545" height="306" alt="" srcset="">
    <div class="container">
      <div class="input-box">
        <span>EMAIL</span>
        <br>
        <input type="email" id="email" placeholder="digite seu email">
      </div>
      <div class="input-box">
        <span>SENHA</span>
        <br>
        <input type="password" id="senha" placeholder="digite sua senha">
        </div>
      <button class="btn" onclick="login()">Login</button>
    </div>
  </main>
  <footer class="footer">

  </footer>
  <script>
    function login() {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      if (email === "" || senha === "") {
        alert("Por favor, preencha todos os campos.");
      } else {
        if(email.includes('@')){
        alert("Bem-vindo(a) a Whis{key}, " + email + "!")
        }
        else{
          alert("Digite um email válido")
        };
      }
    }
  </script>
</body>
</html>
