<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css"/>
    <link rel="stylesheet" href="../utils/index.css"/>
    <link rel="shortcut icon" href="../public/institucional/favicon.png" type="image/x-icon">
    <title>Tela de cadastro</title>
  </head>
  <body>
    <header id="header">
        <nav>
            <a href="../home/index.html"><img src="../public/institucional/logo-whiskey.svg" alt=""></a>
        </nav>

        <div class="navbar">
            <li><a href="../home/index.html">HOME</a></li>
            <li><a href="../saiba-mais/index.html">SOBRE NÓS</a></li>
            <li><a href="../calculadora-financeira/index.html">SIMULADOR</a></li>
        </div>
        <div id="menu">
            <a href="../login/index.html"  style="text-decoration: none;">
             <button class="btn_cliente">ÁREA DO CLIENTE</button>
            </a>
        </div>
    </header>
    <main class="main">
      <img
        src="../public/S{KEY}.svg"
        width="545"
        height="306"
        alt=""
        srcset=""
      />
      <div class="container">
        <div class="input-box">
          <span>EMAIL</span>
          <br />
          <input type="email" id="email" placeholder="digite seu email" />
        </div>
        <div class="input-box">
          <span>NOME</span>
          <br />
          <input type="text" id="nome" placeholder="digite o nome" />
        </div>
        <div class="input-box">
          <span>SENHA</span>
          <br />
          <input type="password" id="senha" placeholder="digite sua senha" />
        </div>
        <div class="input-box">
          <span>CONFIRMAR</span>
          <br />
          <input
            type="password"
            id="confirmar_senha"
            placeholder="confirme a senha"
          />
        </div>
        <button class="btn" onclick="cadastrar()">Cadastrar</button>
      </div>
    </main>
    <footer class="footer"></footer>
    <script>
      function cadastrar() {
        var nome = document.getElementById("nome").value;
        var email = document.getElementById("email").value;
        var senha = document.getElementById("senha").value;
        var confsenha = document.getElementById("confirmar_senha").value;

        if (nome === "" || email === "" || senha === "" || confsenha === "") {
          alert(`Por favor, preencha todos os campos.`);
        } 
        else {
          if ((nome!= isNaN) && email.includes("@") && senha == confsenha) {
            alert(`Cadastro realizado com sucesso, ${nome} !`);
            
          }
          else{
            alert(`Falha ao realizar oo cadastro, Verifique as informações`)
          }
        }
      }
    </script>
  </body>
</html>
