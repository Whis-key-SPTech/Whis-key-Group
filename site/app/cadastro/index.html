<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Tela de Login</title>
</head>
<body>
  <header class="header">
    <div class="logo">
     <img src="../public/Whiskey.logo 1.svg" width="258.64" height="145.49">
    </div>
  </header>
  <main class="main">
    <img src="../public/S{KEY}.svg" width="545" height="306" alt="" srcset="">
    <div class="container">
      <div class="input-box">
        <span>EMAIL</span>
        <br>
        <input type="email" id="email" placeholder="digite seu email">
      </div>
      <div class="input-box">
        <span>NOME</span>
        <br>
        <input type="text" id="nome" placeholder="digite o nome">
        </div>
        <div class="input-box">
        <span>SENHA</span>
        <br>
        <input type="password" id="senha" placeholder="digite sua senha">
      </div>
      <div class="input-box">
        <span>CONFIRMAR</span>
        <br>
        <input type="password" id="confirmar_senha" placeholder="confirme a senha">
        </div>
      <button class="btn" onclick="cadastrar()">Cadastrar</button>
    </div>
  </main>
  <footer class="footer">

  </footer>
  <script>
    function cadastrar() {
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      if (email === "" || senha === "") {
        alert("Por favor, preencha todos os campos.");
      } else {
        alert("Bem-vindo(a) a Whis{key}, " + email + "!");
      }
    }
  </script>
</body>
</html>
