<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Angel's Share</title>
  <link rel="stylesheet" href="./calculadoraFinanceira_css.css">
</head>

<body>
  <div class="container">

    <!-- Cabeçalho -->
    <header class="top-bar">
      <h1>🍸 Calculadora Angel's Share</h1>
      <nav class="nav-tabs">
        <button class="tab active" id="btnTaxa">Taxa de Angel’s Share</button>
        <button class="tab" id="btnPerda">Perda por Angel’s Share</button>
      </nav>
    </header>

    <!-- Painel principal -->
    <div class="content">

      <!-- LADO ESQUERDO -->
      <div class="left-panel">
        <div id="calc-container" class="calc-container fade">
          <!-- Conteúdo injetado via JS -->
        </div>
      </div>

      <!-- LADO DIREITO -->
      <div class="right-panel">
        <div class="quote">
          <p>"Grandes coisas levam tempo, e monitoramento. ✨Whis-key✨"</p>
        </div>
        <div id="resultado" class="resultado"></div>
      </div>
    </div>
  </div>

<script>
  const calcContainer = document.getElementById("calc-container");
  const resultado = document.getElementById("resultado");
  const btnTaxa = document.getElementById("btnTaxa");
  const btnPerda = document.getElementById("btnPerda");

  let currentCalc = 'taxa';

  window.onload = () => {
    mostrarCalculadora('taxa', false);
  };

  btnTaxa.onclick = () => trocarCalculadora('taxa');
  btnPerda.onclick = () => trocarCalculadora('perda');

  function trocarCalculadora(tipo) {
    if (tipo === currentCalc) return;

    toggleActive(tipo === 'taxa' ? btnTaxa : btnPerda);

    // define direção da animação
    const direction = tipo === 'taxa' ? 'slide-right' : 'slide-left';
    calcContainer.classList.add(direction);

    setTimeout(() => {
      mostrarCalculadora(tipo, true);
      calcContainer.classList.remove('slide-left', 'slide-right');
    }, 400);
  }

  function toggleActive(activeButton) {
    document.querySelectorAll(".tab").forEach(btn => btn.classList.remove("active"));
    activeButton.classList.add("active");
  }

  function mostrarCalculadora(tipo, animar) {
    resultado.innerHTML = "";
    currentCalc = tipo;

    if (tipo === 'perda') {
      calcContainer.innerHTML = `
        <h2>Perda por Angel's Share</h2>
        <label>Quantidade de barris</label>
        <input type="number" id="input_barrilQuant">

        <label>Tamanho dos barris (L)</label>
        <input type="number" id="input_tamBarril">

        <label>Preço médio por litro (R$)</label>
        <input type="number" id="input_precoMedio">

        <label>Taxa de Angel’s Share (%)</label>
        <input type="number" id="input_angelShare">

        <label>Tempo de maturação (anos)</label>
        <input type="number" id="input_anos">

        <button onclick="getAngelLoss()">Calcular Perda</button>
      `;
    } else {
      calcContainer.innerHTML = `
        <h2>Taxa de Angel's Share</h2>
        <label>Volume inicial (L)</label>
        <input type="number" id="input_volumeInicial">

        <label>Volume final (L)</label>
        <input type="number" id="input_volumeFinal">

        <label>Tempo de maturação (anos)</label>
        <input type="number" id="input_anos2">

        <button onclick="getAngel()">Calcular Angel's Share</button>
        <button onclick="btt_calcularmelhor()">Melhor Cenário (4%)</button>
      `;
    }

    if (animar) {
      calcContainer.classList.remove("fade-in");
      void calcContainer.offsetWidth;
      calcContainer.classList.add("fade-in");
    }
  }

  // --- CÁLCULOS ---
  let perda = 0, precoMedio = 0, tamBarril = 0, quantBarril = 0, contadorCalc1 = 0;

  function getAngelLoss() {
    quantBarril = Number(input_barrilQuant.value);
    tamBarril = Number(input_tamBarril.value);
    const inicial = quantBarril * tamBarril;
    const ratio = Number(input_angelShare.value / 100);
    const ano = Number(input_anos.value);
    precoMedio = Number(input_precoMedio.value);

    if (!quantBarril || !tamBarril || !precoMedio || !ratio || !ano) {
      resultado.innerHTML = "<p>Por favor, preencha todos os campos.</p>";
      resultado.classList.add("mostrar");
      return;
    }

    const valorFinal = inicial * Math.pow(1 - ratio, ano);
    perda = inicial - valorFinal;
    const valorPerda = perda * precoMedio;
    const perdaBarril = perda / tamBarril;

    resultado.innerHTML = `
      <h2>Resultados</h2>
      <p>Após <b>${ano}</b> anos, dos <b>${inicial.toFixed(2)}L</b> iniciais sobrarão <b>${valorFinal.toFixed(2)}L</b>.</p>
      <p>Perda total: <b>${perda.toFixed(2)}L</b> (${((perda * 100) / inicial).toFixed(1)}%)</p>
      <p>Equivalente a <b>${perdaBarril.toFixed()}</b> barris perdidos.</p>
      <p>Prejuízo estimado: <b>${valorPerda.toLocaleString("pt-BR", {style:"currency", currency:"BRL"})}</b></p>
    `;
    resultado.classList.add("mostrar");
    getInfo(ano);
  }

  function getInfo(ano) {
    const perdaDiaria = (perda / ano) / 365.25;
    const valorDiario = perdaDiaria * precoMedio;
    resultado.innerHTML += `
      <hr>
      <p>Perda diária: <b>${perdaDiaria.toFixed(2)}L</b></p>
      <p>Prejuízo diário: <b>${valorDiario.toLocaleString("pt-BR", {style:"currency", currency:"BRL"})}</b></p>
    `;
  }

  function getAngel() {
    const volumeInicial = Number(input_volumeInicial.value);
    const volumeFinal = Number(input_volumeFinal.value);
    const ano = Number(input_anos2.value);

    if (!volumeInicial || !volumeFinal || !ano) {
      resultado.innerHTML = "<p>Por favor, preencha todos os campos.</p>";
      resultado.classList.add("mostrar");
      return;
    }

    const aShare = (1 - Math.pow(volumeFinal / volumeInicial, 1 / ano)) * 100;
    resultado.innerHTML = `
      <h2>Resultados</h2>
      <p>Volume inicial: ${volumeInicial}L</p>
      <p>Volume final: ${volumeFinal}L</p>
      <p>Tempo de maturação: ${ano} anos</p>
      <p><b>Angel’s Share: ${aShare.toFixed(2)}% ao ano</b></p>
    `;
    resultado.classList.add("mostrar");
    contadorCalc1 = 0;
  }

  function btt_calcularmelhor() {
    const volumeInicial = Number(input_volumeInicial.value);
    const volumeFinal = Number(input_volumeFinal.value);
    const anos = Number(input_anos2.value);
    if (!volumeInicial || !volumeFinal || !anos) return;
    const shareIdeal = volumeInicial * Math.pow(1 - 0.04, anos);
    if (contadorCalc1 < 1) {
      resultado.innerHTML += `
        <hr>
        <p>Comparando com cenário ideal (4%/ano):</p>
        <p>Você deixaria de perder cerca de <b>${(shareIdeal - volumeFinal).toFixed(2)}L</b>.</p>
        <p>Reserva final ideal: <b>${shareIdeal.toFixed(2)}L</b>.</p>
      `;
      contadorCalc1++;
    }
  }
</script>

</body>
</html>
