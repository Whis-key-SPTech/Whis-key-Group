<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Angel's Share</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="../utils/index.css">
</head>

<body>
   <header id="header">
        <nav>
            <a href="../home/index.html"><img src="../public/institucional/logo-whiskey.svg" alt=""></a>
        </nav>

        <div class="navbar">
            <li><a href="../home/index.html">HOME</a></li>
            <li><a href="../saiba-mais/index.html">SOBRE NÓS</a></li>
            <li><a href="../calculadora-financeira/index.html">SIMULADOR</a></li>
        </div>
        <div id="menu">
            <a href="../login/index.html"  style="text-decoration: none;">
             <button class="btn_cliente">ÁREA DO CLIENTE</button>
            </a>
        </div>
    </header>
  <div class="container">
    <div class="content">
      <div class="left-panel">
         <nav class="nav-tabs">
        <button class="tab active" id="btnTaxa" onclick="trocarCalculadoraTaxa()">Taxa de Angel’s Share</button>
        <button class="tab" id="btnPerda" onclick="trocarCalculadoraPerda()">Perda por Angel’s Share</button>
      </nav>
      <br>
        <div id="calcContainer" class="calc-container fade">
        </div>
      </div>
      <div class="right-panel">
        <div class="quote">
          <p>"Grandes coisas levam tempo, e monitoramento."</p>
        </div>
        <div id="resultado" class="resultado"></div>
      </div>
    </div>
  </div>
<script>
  var calcContainerVar = calcContainer.value;
  var resultadoVar = resultado.value;
  var btnTaxaVar = btnTaxa;
  var btnPerdaVar = btnPerda;
  var tipo = 'taxa'

  var currentCalc = 'taxa';

  mostrarCalculadora();

  function trocarCalculadoraTaxa() {
    tipo = 'taxa'
    toggleActive();
    var direction = 'slide-right';
    calcContainer.classList.add(direction);

    setTimeout(() => {
      mostrarCalculadora();
      calcContainer.classList.remove('slide-left', 'slide-right');
    }, 400);
  }

  function trocarCalculadoraPerda() {
    tipo = 'perda'
    toggleActive();
    var direction = 'slide-left';
    calcContainer.classList.add(direction);

    setTimeout(() => {
      mostrarCalculadora();
      calcContainer.classList.remove('slide-left', 'slide-right');
    }, 400);
  }


  function toggleActive() {
    if(tipo == 'perda'){
        btnPerdaVar.classList.remove("active");
    }else{
        btnTaxaVar.classList.remove("active");
    }
  }

  function mostrarCalculadora() {
    resultado.innerHTML = "";
    currentCalc = tipo;

    if (tipo === 'perda') {
      calcContainer.innerHTML = `
        <h2>Perda por Angel's Share</h2>
        <label>Quantidade de barris</label>
        <input type="number" id="input_barrilQuant">

        <label>Tamanho dos barris (L)</label>
        <input type="number" id="input_tamBarril">

        <label>Preço médio por litro (R$)</label>
        <input type="number" id="input_precoMedio">

        <label>Taxa de Angel’s Share (%)</label>
        <input type="number" id="input_angelShare">

        <label>Tempo de maturação (anos)</label>
        <input type="number" id="input_anos">

        <button onclick="getAngelLoss()">Calcular Perda</button>
      `;
    } else {
      calcContainer.innerHTML = `
        <h2>Taxa de Angel's Share</h2>
        <label>Volume inicial (L)</label>
        <input type="number" id="input_volumeInicial">

        <label>Volume final (L)</label>
        <input type="number" id="input_volumeFinal">

        <label>Tempo de maturação (anos)</label>
        <input type="number" id="input_anos2">

        <button onclick="getAngel()">Calcular Angel's Share</button>
        <button onclick="btt_calcularmelhor()">Melhor Cenário (4%)</button>
      `;
    }

      calcContainer.classList.remove("fade-in");
      calcContainer.classList.add("fade-in");
  }

  let perda = 0, precoMedio = 0, tamBarril = 0, quantBarril = 0, contadorCalc1 = 0;

  function getAngelLoss() {
    quantBarril = Number(input_barrilQuant.value);
    tamBarril = Number(input_tamBarril.value);
    var inicial = quantBarril * tamBarril;
    var ratio = Number(input_angelShare.value / 100);
    var ano = Number(input_anos.value);
    precoMedio = Number(input_precoMedio.value);

    if (!quantBarril || !tamBarril || !precoMedio || !ratio || !ano) {
      resultado.innerHTML = "<p>Por favor, preencha todos os campos.</p>";
      resultado.classList.add("mostrar");
      return;
    }

    var valorFinal = inicial * Math.pow(1 - ratio, ano);
    perda = inicial - valorFinal;
    var valorPerda = perda * precoMedio;
    var perdaBarril = perda / tamBarril;

    resultado.innerHTML = `
      <h2>Resultados</h2>
      <p>Após <b>${ano}</b> anos, dos <b>${inicial.toFixed(2)}L</b> iniciais sobrarão <b>${valorFinal.toFixed(2)}L</b>.</p>
      <p>Perda total: <b>${perda.toFixed(2)}L</b> (${((perda * 100) / inicial).toFixed(1)}%)</p>
      <p>Equivalente a <b>${perdaBarril.toFixed()}</b> barris perdidos.</p>
      <p>Prejuízo estimado: <b>${valorPerda.toLocaleString("pt-BR", {style:"currency", currency:"BRL"})}</b></p>
    `;
    resultado.classList.add("mostrar");
    getInfo(ano);
  }

  function getInfo(ano) {
    var perdaDiaria = (perda / ano) / 365.25;
    var valorDiario = perdaDiaria * precoMedio;
    resultado.innerHTML += `
      <hr>
      <p>Perda diária: <b>${perdaDiaria.toFixed(2)}L</b></p>
      <p>Prejuízo diário: <b>${valorDiario.toLocaleString("pt-BR", {style:"currency", currency:"BRL"})}</b></p>
    `;
  }

  function getAngel() {
    var volumeInicial = Number(input_volumeInicial.value);
    var volumeFinal = Number(input_volumeFinal.value);
    var ano = Number(input_anos2.value);

    if (!volumeInicial || !volumeFinal || !ano) {
      resultado.innerHTML = "<p>Por favor, preencha todos os campos.</p>";
      resultado.classList.add("mostrar");
    }

    var aShare = (1 - Math.pow(volumeFinal / volumeInicial, 1 / ano)) * 100;
    resultado.innerHTML = `
      <h2>Resultados</h2>
      <p>Volume inicial: ${volumeInicial}L</p>
      <p>Volume final: ${volumeFinal}L</p>
      <p>Tempo de maturação: ${ano} anos</p>
      <p><b>Angel’s Share: ${aShare.toFixed(2)}% ao ano</b></p>
    `;
    resultado.classList.add("mostrar");
    contadorCalc1 = 0;
  }

  function btt_calcularmelhor() {
    var volumeInicial = Number(input_volumeInicial.value);
    var volumeFinal = Number(input_volumeFinal.value);
    var anos = Number(input_anos2.value);
    if (!volumeInicial || !volumeFinal || !anos);
    var shareIdeal = volumeInicial * Math.pow(1 - 0.04, anos);
    if (contadorCalc1 < 1) {
      resultado.innerHTML += `
        <hr>
        <p>Comparando com cenário ideal (4%/ano):</p>
        <p>Você deixaria de perder cerca de <b>${(shareIdeal - volumeFinal).toFixed(2)}L</b>.</p>
        <p>Reserva final ideal: <b>${shareIdeal.toFixed(2)}L</b>.</p>
      `;
      contadorCalc1++;
    }
  }
</script>

</body>
</html>
